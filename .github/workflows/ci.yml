name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Both jobs run in Glass's builder image (scripts/builder/Dockerfile in
# foonerd/glass, named here by its digest): the compilers and libraries are
# in it, and a job installs no system package while it runs. Build caches
# are written from main only and read by the release.
jobs:
  check:
    name: format, lints, tests, docs
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml, in the image unless the file has moved on
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh

  ship:
    name: cross builds and the component
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ship
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ship.sh
      - run: scripts/package.sh
      - name: The component names the commit it was built from
        run: |
          unzip -p dist/glass-evo-*.zip manifest.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - name: A remote's bundle installs as the bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          work=$(mktemp -d)
          tar -C "$work" -xzf "dist/glass-evo-$version-x64.tar.gz"
          HOME="$work/home" PREFIX="$work/home/.local" sh "$work/glass-evo-$version-x64/remote/linux/install.sh" | tee "$work/said"
          grep -F "flavour:   the bundle, glass-evo $version" "$work/said"
      - uses: actions/upload-artifact@v7
        with:
          name: glass-evo-component
          path: |
            dist/glass-evo-*.zip
            dist/glass-evo-*-*.tar.gz
          if-no-files-found: error
