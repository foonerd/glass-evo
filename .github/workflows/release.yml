name: release

# A tag builds the release: the check and the cross builds side by side in
# Glass's builder image, then the component published as a pre-release.
# Run by hand it builds everything and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints, tests, docs
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the workspace carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, the workspace is $version" >&2; exit 1; }
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: false
      - run: scripts/check.sh

  component:
    name: cross builds and the component
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ship
          cache-bin: false
          save-if: false
      - run: scripts/ship.sh
      - run: scripts/package.sh
      - name: The component names the commit it was built from
        run: |
          unzip -p dist/glass-evo-*.zip manifest.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - name: A remote's bundle installs as the bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          work=$(mktemp -d)
          tar -C "$work" -xzf "dist/glass-evo-$version-x64.tar.gz"
          HOME="$work/home" PREFIX="$work/home/.local" sh "$work/glass-evo-$version-x64/remote/linux/install.sh" | tee "$work/said"
          grep -F "flavour:   the bundle, glass-evo $version" "$work/said"
      - uses: actions/upload-artifact@v7
        with:
          name: release-component
          path: |
            dist/glass-evo-*.zip
            dist/glass-evo-*-*.tar.gz
          if-no-files-found: error

  windows:
    name: windows cross build, the remote's bundle laid out
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-bin: false
          save-if: false
      - run: scripts/ship-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/windows
          if-no-files-found: error

  # The Android app is signed with the project's key when the repository
  # holds it (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS), the
  # key Glass's own app carries, so the bundle installs over the standalone;
  # without it the apk carries a throwaway key and is not published.
  android:
    name: android build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: The NDK, the build tools and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" >/dev/null
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          save-if: false
      - name: The Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glass-android.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/glass-android.jks"
          fi
          scripts/ship-android.sh
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no signing key in the repository: the apk is not published"
            rm -f dist/glass-evo-*-android.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/glass-evo-*-android.apk
          if-no-files-found: ignore

  publish:
    name: sign, publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, component, windows, android]
    runs-on: ubuntu-24.04
    # The environment names this job to Azure: the federated credential for
    # Trusted Signing matches repo glass-evo, environment release.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-component
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          pattern: release-android
          path: dist
          merge-multiple: true
      # The Windows display and the installer scripts are signed with Azure
      # Trusted Signing when the repository holds the account (variables
      # TRUSTED_SIGNING_ENDPOINT, _ACCOUNT, _PROFILE; secrets AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID for a federated login);
      # without them the bundle is published unsigned.
      - name: Azure login for Trusted Signing
        if: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the Windows display and the installer
        if: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' }}
        run: scripts/sign-windows.sh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
      - name: The Windows bundle as one archive
        run: |
          top=$(ls dist/windows | head -n1)
          [ "$top" = "glass-evo-${GITHUB_REF_NAME#v}-windows-x64" ] || { echo "the bundle laid out is $top" >&2; exit 1; }
          (cd dist/windows && zip -qr "../$top.zip" "$top")
          ls -la "dist/$top.zip"
      # Every asset's digest in SHA256SUMS, signed with the project's
      # release key (secret RELEASE_SIGNING_KEY, the Ed25519 private key as
      # PEM, the same key as Glass's) and checked against the public key the
      # products carry (keys/release-signing.pub), so no release goes out
      # that a player or a remote would refuse. Without the secret the
      # release is published unsigned, and installs as it did before signing.
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: the release is published unsigned"
            exit 0
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "glass-evo $v" > dist/notes.md
          printf '\n' >> dist/notes.md
          cat .github/release-footer.md >> dist/notes.md
      # Published as a pre-release: no player is offered it but one set to
      # take test releases. It is made the latest by hand once it has been
      # tried (gh release edit <tag> --prerelease=false --latest).
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          name: glass-evo ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/glass-evo-*.zip
            dist/glass-evo-*-*.tar.gz
            dist/glass-evo-*-android.apk
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
