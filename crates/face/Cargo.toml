[package]
name = "face"
description = "The face's library: what glass-evo draws over the display and does with the touches."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# What a face is written against, from Glass: the contract with the
# display and the types it draws with. It knows no window, so the face
# builds for the player's screen and for a browser alike. Pinned to a
# Glass release.
overlay = { git = "https://github.com/foonerd/glass", tag = "v0.8.79" }
serde_json = "1"

# The C library, only to hold the face's own reading of a time pattern
# against the library's in a test.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
