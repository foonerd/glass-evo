[package]
name = "glass-evo-android"
description = "The Android shell of the face: libmain.so, which SDL's activity loads and enters, for the bundle of a Glass remote display"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "main"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
face = { path = "../../crates/face" }
glass = { git = "https://github.com/foonerd/glass", tag = "v0.8.49" }

[lints]
workspace = true
