[workspace]
resolver = "2"
members = [
    "crates/face",
    "bins/glass-evo",
    "bins/glass-evo-face",
    "bins/glass-evo-android",
]

# The browser module: one unit, linked whole, so the page loads the least.
[profile.face]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"

[workspace.package]
version = "0.1.54"
edition = "2021"
license = "MIT"
publish = false

# The least Glass plugin this glass-evo works with. The component's
# manifest carries it, and the Glass Manager installs the component only
# on a Glass that is at least this.
[workspace.metadata.glass]
plugin = "0.7.97"

# One set of lints for every crate; CI denies warnings.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
